<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Planificador CGS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16262B">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#E9EEF0;
    --surface:#FFFFFF;
    --ink:#16262B;
    --muted:#5B7075;
    --line:#D3DBDC;
    --accent:#2F6F4E;
    --accent-ink:#FFFFFF;
    --warm:#C97A2B;
    --danger:#B3432B;
    --radius:10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    padding-bottom:calc(64px + var(--safe-bottom));
  }
  h1,h2,h3{
    font-family:Georgia,"Times New Roman",serif;
    margin:0;
    font-weight:700;
  }
  header.app-header{
    background:var(--ink);
    color:#EDEFF2;
    padding:16px 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.app-header h1{font-size:19px;letter-spacing:0.2px;}
  header.app-header .sub{font-size:12.5px;color:#9DB0AB;margin-top:2px;}

  .week-strip{
    display:flex;
    gap:8px;
    padding:12px 16px 4px;
    overflow-x:auto;
    background:var(--bg);
    position:sticky;
    top:64px;
    z-index:15;
    scrollbar-width:none;
  }
  .week-strip::-webkit-scrollbar{display:none;}
  .week-pill{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:13.5px;
    color:var(--muted);
    white-space:nowrap;
  }
  .week-pill.active{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
    font-weight:600;
  }
  .week-pill.add{color:var(--accent);border-style:dashed;}

  main{padding:12px 16px 24px;}
  section{margin-bottom:18px;}
  .section-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  /* Client list */
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  input[type=text], select{
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
    font-size:14px;
    color:var(--ink);
  }
  .ruta-group{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
    margin-bottom:8px;
    overflow:hidden;
  }
  .ruta-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    cursor:pointer;
  }
  .ruta-head .name{
    font-weight:600;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ruta-chip{
    width:10px;height:10px;border-radius:3px;flex:0 0 auto;
  }
  .ruta-head .count{font-size:12px;color:var(--muted);}
  .ruta-actions{display:flex;gap:10px;align-items:center;}
  .btn-mini{
    font-size:12px;
    color:var(--accent);
    background:none;
    border:none;
    padding:4px 6px;
    font-weight:600;
  }
  .client-list{display:none;border-top:1px solid var(--line);}
  .client-list.open{display:block;}
  .client-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .client-row:last-child{border-bottom:none;}
  .client-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;}
  .client-info .cname{font-size:13.5px;font-weight:600;}
  .client-info .cmeta{font-size:11.5px;color:var(--muted);margin-top:1px;}

  /* Day tickets */
  .tickets{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .ticket{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px;
    position:relative;
    min-height:74px;
    text-align:left;
  }
  .ticket::after{
    content:"";
    position:absolute;
    right:-7px;top:50%;
    width:14px;height:14px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .ticket:nth-child(even)::after{display:none;}
  .ticket .day-name{
    font-family:Georgia,serif;
    font-weight:700;
    font-size:14.5px;
  }
  .ticket .day-route{
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
    min-height:14px;
  }
  .ticket .day-count{
    font-size:11px;
    color:var(--warm);
    font-weight:700;
    margin-top:6px;
  }
  .ticket.has-selection{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }

  .selection-bar{
    position:fixed;
    left:0;right:0;
    bottom:calc(58px + var(--safe-bottom));
    background:var(--ink);
    color:#fff;
    padding:10px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    z-index:25;
  }
  .selection-bar.show{display:flex;}
  .selection-bar button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
  }
  .selection-bar .clear{background:none;color:#B7C4C1;padding:8px 4px;}

  /* Calendar view */
  .day-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:12px;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:8px 13px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:13px;
    color:var(--muted);
  }
  .day-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .visit-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .visit-card .vname{font-weight:600;font-size:14px;}
  .visit-card .vmeta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .visit-card .vroute{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent);
    background:#E4EFE8;
    padding:2px 7px;
    border-radius:5px;
    margin-top:6px;
  }
  .remove-btn{
    background:none;border:none;color:var(--danger);
    font-size:12px;font-weight:600;padding:4px;flex:0 0 auto;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:13.5px;
  }

  /* Tab bar */
  nav.tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:var(--safe-bottom);
    z-index:30;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    padding:10px 0 8px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  nav.tabbar button.active{color:var(--accent);font-weight:700;}
  nav.tabbar .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  nav.tabbar button.active .dot{background:var(--accent);}

  .view{display:none;}
  .view.active{display:block;}

  .import-box{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:14px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
  .import-box button{
    margin-top:10px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
  }
  #fileInput{display:none;}
  .toast{
    position:fixed;
    left:50%;bottom:calc(74px + var(--safe-bottom));
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:50;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1;}
  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:18px;padding:2px 6px;
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>Planificador CGS</h1>
  <div class="sub" id="monthLabel">Cargando...</div>
</header>

<div class="week-strip" id="weekStrip"></div>

<main>
  <!-- VISTA: PROGRAMACIÓN -->
  <div class="view active" id="view-programacion">

    <section id="importSection" style="display:none;">
      <div class="import-box">
        Aún no has importado tu lista de clientes.
        <br>
        <button onclick="document.getElementById('fileInput').click()">Importar Excel de clientes</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
      </div>
    </section>

    <section id="clientSection" style="display:none;">
      <div class="section-title">
        <span>Clientes</span>
        <button class="btn-mini" onclick="document.getElementById('fileInput').click()">Reimportar</button>
        <input type="file" id="fileInput2" accept=".xlsx,.xls" style="display:none;">
      </div>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Buscar cliente...">
      </div>
      <div id="rutaGroups"></div>
    </section>

    <section id="ticketsSection" style="display:none;">
      <div class="section-title"><span>Asignar a un día de esta semana</span></div>
      <div class="tickets" id="ticketsGrid"></div>
    </section>
  </div>

  <!-- VISTA: CALENDARIO -->
  <div class="view" id="view-calendario">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="visitList"></div>
  </div>
</main>

<div class="selection-bar" id="selectionBar">
  <span id="selectionText">0 seleccionados</span>
  <div>
    <button class="clear" onclick="clearSelection()">Limpiar</button>
  </div>
</div>

<nav class="tabbar">
  <button id="tab-programacion" class="active" onclick="switchView('programacion')">
    <span class="dot"></span>Programación
  </button>
  <button id="tab-calendario" onclick="switchView('calendario')">
    <span class="dot"></span>Calendario
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================
   PLANIFICADOR CGS
   Datos: clientes (importados de Excel) + visitas por semana
   Estructura NO conectada aún a GestorPedidosCGS (pendiente)
   ========================================================= */

const LS_CLIENTES = 'pcgs_clientes';
const LS_MESES = 'pcgs_meses';

const DIAS = [
  {key:'martes',  label:'Martes'},
  {key:'miercoles',label:'Miércoles'},
  {key:'jueves',  label:'Jueves'},
  {key:'viernes', label:'Viernes'},
  {key:'extra',   label:'Día Extra'}
];

const COLUMN_MAP = {
  'id sistema':'idSistema','idsistema':'idSistema',
  'nombre':'nombre',
  'id cliente':'idCliente','idcliente':'idCliente',
  'contacto':'contacto',
  'prioridad':'prioridad',
  'teléfono':'telefono','telefono':'telefono',
  'dirección':'direccion','direccion':'direccion',
  'departamento':'departamento',
  'sector':'sector',
  'ruta':'ruta',
  'tipo':'tipo'
};

const RUTA_COLORS = ['#2F6F4E','#C97A2B','#3E6E88','#7A4E9E','#B3432B','#5B7075','#1F7A6C','#946B2D'];

let state = {
  clientes: [],
  meses: {},          // { "2026-09": { weeks: [ {label, slots:{martes:[idCliente,...], ...}} ] } }
  currentMonthKey: '',
  currentWeekIndex: 0,
  currentView: 'programacion',
  currentDayKey: 'martes',
  selected: new Set(),
  openRutas: new Set()
};

function todayMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return nombres[m-1] + ' ' + y;
}

function rutaColor(ruta){
  if(!ruta) return '#5B7075';
  let hash = 0;
  for(let i=0;i<ruta.length;i++) hash = ruta.charCodeAt(i) + ((hash<<5)-hash);
  return RUTA_COLORS[Math.abs(hash) % RUTA_COLORS.length];
}

function save(){
  localStorage.setItem(LS_CLIENTES, JSON.stringify(state.clientes));
  localStorage.setItem(LS_MESES, JSON.stringify(state.meses));
}

function load(){
  try{ state.clientes = JSON.parse(localStorage.getItem(LS_CLIENTES)) || []; }catch(e){ state.clientes = []; }
  try{ state.meses = JSON.parse(localStorage.getItem(LS_MESES)) || {}; }catch(e){ state.meses = {}; }
  state.currentMonthKey = todayMonthKey();
  ensureMonth(state.currentMonthKey);
}

function ensureMonth(key){
  if(!state.meses[key]){
    state.meses[key] = { weeks: [ newWeek(1) ] };
  }
}

function newWeek(n){
  return {
    label: 'Semana ' + n,
    slots: { martes:[], miercoles:[], jueves:[], viernes:[], extra:[] }
  };
}

function currentMonth(){
  return state.meses[state.currentMonthKey];
}
function currentWeek(){
  return currentMonth().weeks[state.currentWeekIndex];
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------- RENDER: header / semanas ---------- */
function renderHeader(){
  document.getElementById('monthLabel').textContent = monthLabel(state.currentMonthKey);
}

function renderWeekStrip(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  currentMonth().weeks.forEach((w, i)=>{
    const pill = document.createElement('button');
    pill.className = 'week-pill' + (i===state.currentWeekIndex ? ' active':'');
    pill.textContent = w.label;
    pill.onclick = ()=>{ state.currentWeekIndex = i; state.selected.clear(); renderAll(); };
    strip.appendChild(pill);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'week-pill add';
  addBtn.textContent = '+ Semana';
  addBtn.onclick = ()=>{
    const weeks = currentMonth().weeks;
    weeks.push(newWeek(weeks.length+1));
    state.currentWeekIndex = weeks.length-1;
    save();
    renderAll();
  };
  strip.appendChild(addBtn);
}

/* ---------- RENDER: clientes ---------- */
function clientById(id){
  return state.clientes.find(c => (c.idCliente||c.idSistema) === id);
}

function groupByRuta(list){
  const groups = {};
  list.forEach(c=>{
    const r = c.ruta || 'Sin ruta';
    if(!groups[r]) groups[r] = [];
    groups[r].push(c);
  });
  return groups;
}

function renderClientSection(){
  const hasClients = state.clientes.length > 0;
  document.getElementById('importSection').style.display = hasClients ? 'none':'block';
  document.getElementById('clientSection').style.display = hasClients ? 'block':'none';
  document.getElementById('ticketsSection').style.display = hasClients ? 'block':'none';
  if(!hasClients) return;

  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const filtered = state.clientes.filter(c=>{
    if(!query) return true;
    return (c.nombre||'').toLowerCase().includes(query) ||
           (c.ruta||'').toLowerCase().includes(query) ||
           (c.sector||'').toLowerCase().includes(query);
  });
  const groups = groupByRuta(filtered);
  const wrap = document.getElementById('rutaGroups');
  wrap.innerHTML = '';

  Object.keys(groups).sort().forEach(ruta=>{
    const clients = groups[ruta];
    const isOpen = state.openRutas.has(ruta) || query.length>0;
    const div = document.createElement('div');
    div.className = 'ruta-group';

    const head = document.createElement('div');
    head.className = 'ruta-head';
    head.innerHTML = `
      <span class="name"><span class="ruta-chip" style="background:${rutaColor(ruta)}"></span>${ruta}
        <span class="count">(${clients.length})</span>
      </span>
      <div class="ruta-actions">
        <button class="btn-mini" data-action="select-all">Seleccionar todos</button>
        <span class="icon-btn">${isOpen ? '▾' : '▸'}</span>
      </div>
    `;
    head.querySelector('[data-action="select-all"]').onclick = (e)=>{
      e.stopPropagation();
      clients.forEach(c=> state.selected.add(c.idCliente||c.idSistema));
      renderClientSection();
      renderSelectionBar();
      renderTickets();
    };
    head.onclick = ()=>{
      if(state.openRutas.has(ruta)) state.openRutas.delete(ruta);
      else state.openRutas.add(ruta);
      renderClientSection();
    };
    div.appendChild(head);

    const list = document.createElement('div');
    list.className = 'client-list' + (isOpen ? ' open':'');
    clients.forEach(c=>{
      const id = c.idCliente || c.idSistema;
      const row = document.createElement('div');
      row.className = 'client-row';
      row.innerHTML = `
        <input type="checkbox" ${state.selected.has(id)?'checked':''}>
        <div class="client-info">
          <div class="cname">${c.nombre||'(sin nombre)'}</div>
          <div class="cmeta">${[c.prioridad, c.sector, c.telefono].filter(Boolean).join(' · ')}</div>
        </div>
      `;
      row.querySelector('input').onchange = (e)=>{
        if(e.target.checked) state.selected.add(id);
        else state.selected.delete(id);
        renderSelectionBar();
        renderTickets();
      };
      list.appendChild(row);
    });
    div.appendChild(list);
    wrap.appendChild(div);
  });
}

function renderSelectionBar(){
  const bar = document.getElementById('selectionBar');
  const n = state.selected.size;
  bar.classList.toggle('show', n>0);
  document.getElementById('selectionText').textContent =
    n + (n===1 ? ' cliente seleccionado — toca un día para asignar' : ' clientes seleccionados — toca un día para asignar');
}

function clearSelection(){
  state.selected.clear();
  renderClientSection();
  renderSelectionBar();
  renderTickets();
}

/* ---------- RENDER: tarjetas de día ---------- */
function renderTickets(){
  const grid = document.getElementById('ticketsGrid');
  grid.innerHTML = '';
  const week = currentWeek();
  DIAS.forEach(d=>{
    const ids = week.slots[d.key];
    const clients = ids.map(clientById).filter(Boolean);
    const rutas = [...new Set(clients.map(c=>c.ruta).filter(Boolean))];
    const div = document.createElement('div');
    div.className = 'ticket' + (state.selected.size>0 ? ' has-selection':'');
    div.innerHTML = `
      <div class="day-name">${d.label}</div>
      <div class="day-route">${rutas.join(' / ') || '—'}</div>
      <div class="day-count">${clients.length} visita${clients.length===1?'':'s'}</div>
    `;
    div.onclick = ()=>{
      if(state.selected.size===0){
        switchView('calendario');
        state.currentDayKey = d.key;
        renderCalendarView();
        return;
      }
      state.selected.forEach(id=>{
        if(!week.slots[d.key].includes(id)) week.slots[d.key].push(id);
      });
      const n = state.selected.size;
      state.selected.clear();
      save();
      renderClientSection();
      renderSelectionBar();
      renderTickets();
      toast(n + (n===1?' cliente asignado a ':' clientes asignados a ') + d.label);
    };
    grid.appendChild(div);
  });
}

/* ---------- RENDER: vista calendario ---------- */
function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  DIAS.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (d.key===state.currentDayKey ? ' active':'');
    btn.textContent = d.label;
    btn.onclick = ()=>{ state.currentDayKey = d.key; renderCalendarView(); };
    wrap.appendChild(btn);
  });
}

function renderVisitList(){
  const wrap = document.getElementById('visitList');
  wrap.innerHTML = '';
  const week = currentWeek();
  const ids = week.slots[state.currentDayKey] || [];
  const clients = ids.map(clientById).filter(Boolean);

  if(clients.length===0){
    wrap.innerHTML = `<div class="empty-state">Sin visitas asignadas todavía.<br>Ve a "Programación" para agregar clientes a este día.</div>`;
    return;
  }

  clients.forEach(c=>{
    const id = c.idCliente || c.idSistema;
    const card = document.createElement('div');
    card.className = 'visit-card';
    card.innerHTML = `
      <div>
        <div class="vname">${c.nombre||'(sin nombre)'}</div>
        <div class="vmeta">${[c.prioridad, c.direccion, c.telefono, c.contacto].filter(Boolean).join(' · ')}</div>
        <span class="vroute" style="background:${rutaColor(c.ruta)}22;color:${rutaColor(c.ruta)}">${c.ruta||'Sin ruta'}</span>
      </div>
      <button class="remove-btn">Quitar</button>
    `;
    card.querySelector('.remove-btn').onclick = ()=>{
      const arr = week.slots[state.currentDayKey];
      const idx = arr.indexOf(id);
      if(idx>-1) arr.splice(idx,1);
      save();
      renderVisitList();
      renderTickets();
    };
    wrap.appendChild(card);
  });
}

function renderCalendarView(){
  renderDayTabs();
  renderVisitList();
}

/* ---------- vistas / tabs ---------- */
function switchView(view){
  state.currentView = view;
  document.getElementById('view-programacion').classList.toggle('active', view==='programacion');
  document.getElementById('view-calendario').classList.toggle('active', view==='calendario');
  document.getElementById('tab-programacion').classList.toggle('active', view==='programacion');
  document.getElementById('tab-calendario').classList.toggle('active', view==='calendario');
  if(view==='calendario') renderCalendarView();
}

/* ---------- importación de Excel ---------- */
function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const clientes = rows.map(row=>{
        const obj = {};
        Object.keys(row).forEach(k=>{
          const norm = k.toLowerCase().trim();
          const field = COLUMN_MAP[norm];
          if(field) obj[field] = String(row[k]).trim();
        });
        return obj;
      }).filter(c => c.nombre);
      state.clientes = clientes;
      save();
      renderAll();
      toast(clientes.length + ' clientes importados');
    }catch(err){
      toast('No se pudo leer el archivo. Verifica que sea el Excel correcto.');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('fileInput').addEventListener('change', (e)=> handleFile(e.target.files[0]));
document.getElementById('fileInput2').addEventListener('change', (e)=> handleFile(e.target.files[0]));
document.getElementById('searchInput').addEventListener('input', renderClientSection);

/* ---------- init ---------- */
function renderAll(){
  renderHeader();
  renderWeekStrip();
  renderClientSection();
  renderSelectionBar();
  renderTickets();
  if(state.currentView==='calendario') renderCalendarView();
}

load();
renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(console.error);
  });
}
</script>
